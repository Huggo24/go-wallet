services:
  postgres:
    image: postgres:18
    env_file: config.env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    env_file: config.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
volumes:
  db-data: