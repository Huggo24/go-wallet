services:
  postgres-test:
    image: postgres:18
    env_file: config-test.env
    ports:
      - "5433:5432"
    volumes:
      - test-data:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  app-test:
      build: .
      env_file: config-test.env
      depends_on:
        postgres-test:
          condition: service_healthy
      ports:
        - "8081:8080"
volumes:
  test-data: